name: Build VYRA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract VYRA project
        run: |
          rm -rf vyra_project
          mkdir vyra_project
          unzip -q vyra.zip -d vyra_project

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        working-directory: vyra_project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: vyra_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload VYRA APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-APK
          path: vyra_project/app/build/outputs/apk/debug/app-debug.apk
